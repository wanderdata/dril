name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.0" "openpyxl>=3.1" "pyyaml>=6.0" pytest
      - name: Rebuild every project from source
        run: python run_all.py
      - name: Outputs reproduce exactly
        run: git diff --exit-code -- projects
      - name: Tests
        run: pytest -q
