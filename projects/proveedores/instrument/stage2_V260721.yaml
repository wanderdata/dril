  - subsidio_beneficiario
  - subsidio_corte
  - subsidio_monto
  - subsidio_moneda
  - subsidio_anio
  - subsidio_tipo
  - subsidio_cofinanciamiento
  - subsidio_cofinanciamiento_prop
  source: '15.10'
- if: evaluacion
  equals: '2'
  then_not_applicable:
  - evaluacion_tipo
  - evaluacion_disponible
  - evaluacion_link
  source: '15.11'
- if: empresa_ancla
  equals: '2'
  then_not_applicable:
