variables:
- name: nombre
  block: A
  kind: text
  question: ¿Cuál es el nombre oficial completo del programa?
- name: nombre_corto
  block: A
  kind: text
  question: ¿Cuál es la sigla o nombre breve oficialmente utilizado?
- name: entidades_ejecutoras
  block: A
  kind: multitext
  question: ¿Qué entidades participan directamente en la ejecución del programa?
- name: tipo_programa
  block: A
  kind: categorical
  question: ¿Cuál es el mecanismo principal del programa?
  codes:
    '1': Diagnóstico y preparación de proveedores
    '2': Vinculación y acceso a oportunidades comerciales
    '3': Desarrollo integral de proveedores
    '4': Articulación institucional de proveedores
    '-99': Sin información
- name: nivel_programa
  block: A
  kind: categorical
  question: ¿Qué nivel ocupa la iniciativa dentro de la estructura del programa?
  codes:
    '1': Programa o estrategia madre nacional
    '2': Programa territorial o sectorial permanente
    '3': Proyecto con empresa ancla
    '4': Edición o convocatoria de un programa madre
    '-99': Sin información
- name: programa_madre_nombre
  block: A
  kind: text
  question: ¿La iniciativa depende de un programa madre y, en caso afirmativo, cuál?
- name: sector_area
  block: A
  kind: multitext
  question: ¿En qué sectores económicos o áreas productivas opera el programa?
- name: empresa_ancla
  block: A
  kind: categorical
  question: ¿Participan una o más empresas ancla o compradoras identificables?
  codes:
    '1': Sí
    '2': No se identifica una empresa ancla específica
    '-99': Sin información
- name: empresa_ancla_nombre
  block: A
  kind: multitext
  question: ¿Qué empresas ancla o instituciones compradoras participan?
- name: mecanismo_vinculacion
  block: A
  kind: text
  question: ¿Cómo busca el programa crear o fortalecer la relación entre compradores y proveedores?
- name: beneficiario_textual
  block: B
  kind: text
  question: ¿A quién está dirigido el programa?
- name: beneficiario_tipo
  block: B
  kind: categorical
  question: ¿Quiénes son los beneficiarios directos del programa?
  codes:
    '1': Empresas ancla o compradoras
    '2': Empresas proveedoras
    '3': Ambos tipos de empresas
    '-99': Sin información
- name: objetivo_textual
  block: B
  kind: text
  question: ¿Cuál es el objetivo declarado del programa?
- name: objetivo_corto
  block: B
  kind: text
  question: ¿Cuál es el objetivo sustantivo del programa?
- name: cobertura_geografica
  block: C
  kind: categorical
  question: ¿Cuál es la cobertura geográfica del programa?
  codes:
    '1': Nacional
    '2': Intermedia o multiterritorial
    '3': Primera división administrativa
    '4': Local
    '-99': Sin información
- name: anio_inicio
  block: C
  kind: year
  question: ¿En qué año comenzó la ejecución del programa?
- name: vigencia
  block: C
  kind: categorical
  question: ¿Cuál es la situación operativa actual del programa?
  codes:
    '1': Vigente
    '2': Suspendido
    '3': Finalizado
    '-99': Sin información suficiente
- name: presupuesto
  block: D
  kind: numeric
  question: ¿Cuál es el presupuesto del programa en la moneda original?
- name: p_moneda
  block: D
  kind: currency
  question: ¿En qué moneda está expresado el presupuesto?
- name: p_anio
  block: D
  kind: year
  question: ¿A qué año corresponde la cifra de presupuesto?
- name: p_tipo
  block: D
  kind: categorical
  question: ¿Qué clase de presupuesto representa la cifra?
  codes:
    '1': Presupuesto anual
    '2': Presupuesto para múltiples años
    '3': Presupuesto de programa paraguas
    '-99': Sin información
- name: reglamento
  block: D
  kind: categorical
  question: ¿Existe un reglamento, manual operativo, bases u otro documento que describa formalmente el
    funcionamiento del programa?
  codes:
    '1': Sí
    '2': 'No'
    '-99': Sin información
- name: reglamento_link
  block: D
  kind: url
  question: ¿Dónde puede consultarse el documento operativo?
- name: acompanamiento_directo
  block: E
  kind: categorical
  question: ¿La entidad promotora o ejecutora realiza seguimiento directo a los beneficiarios o a sus
    planes de mejora?
  codes:
    '1': Sí
    '2': 'No'
    '-99': Sin información
- name: informacion
  block: E
  kind: categorical
  question: ¿El programa entrega información relevante a compradores o proveedores?
  codes:
    '1': Sí
    '2': 'No'
    '-99': Sin información
- name: informacion_detalle
  block: E
  kind: text
  question: ¿Qué tipo de información entrega el programa?
- name: coordinacion
  block: E
  kind: categorical
  question: ¿El programa coordina a sus participantes con otras entidades, servicios o instrumentos de
    desarrollo productivo?
  codes:
    '1': Sí
    '2': 'No'
    '-99': Sin información
- name: capacitacion
  block: E
  kind: categorical
  question: ¿El programa realiza actividades de formación o capacitación?
  codes:
    '1': Sí
    '2': 'No'
    '-99': Sin información
- name: capacitacion_detalle
  block: E
  kind: text
  question: ¿Sobre qué materias se realizan las capacitaciones?
- name: subsidio
  block: F
  kind: categorical
  question: ¿El programa entrega financiamiento no reembolsable o subsidios?
  codes:
    '1': Sí
    '2': 'No'
    '-99': Sin información
- name: subsidio_objetivo
  block: F
  kind: text
  question: ¿Para qué actividades puede utilizarse el subsidio?
- name: subsidio_beneficiario
  block: F
  kind: text
  question: ¿Quién recibe directamente el subsidio?
- name: subsidio_corte
  block: F
  kind: categorical
  question: ¿Las reglas establecen una reducción, término o retiro del subsidio al avanzar entre etapas
    o al cumplirse cierto plazo?
  codes:
    '1': Sí
    '2': 'No'
    '-88': No aplica porque no existe subsidio
    '-99': Sin información
- name: subsidio_monto
  block: F
  kind: numeric
  question: ¿Cuál es el monto del subsidio en la moneda original?
- name: subsidio_moneda
  block: F
  kind: currency
  question: ¿En qué moneda está expresado el subsidio?
- name: subsidio_anio
  block: F
  kind: year
  question: ¿A qué año corresponde el monto del subsidio?
- name: subsidio_tipo
  block: F
  kind: categorical
  question: ¿Qué representa el monto registrado?
  codes:
    '1': Monto anual
    '2': Monto para múltiples años
    '3': Monto total del programa
    '4': Monto máximo por beneficiario o proyecto
    '-88': No aplica porque no existe subsidio
    '-99': Sin información
- name: subsidio_cofinanciamiento
  block: F
  kind: categorical
  question: ¿Se exige cofinanciamiento empresarial para acceder al subsidio?
  codes:
    '1': Sí
    '2': 'No'
    '-88': No aplica porque no existe subsidio
    '-99': Sin información
- name: subsidio_cofinanciamiento_prop
  block: F
  kind: percent
  question: ¿Qué porcentaje mínimo debe aportar el beneficiario?
- name: evaluacion
  block: G
  kind: categorical
  question: ¿Existe evidencia de que el programa haya sido evaluado?
  codes:
    '1': Sí
    '2': 'No'
    '-99': Sin información
- name: evaluacion_tipo
  block: G
  kind: multicategorical
  question: ¿Qué tipo de evaluación se realizó?
  codes:
    '1': Monitoreo o seguimiento administrativo
    '2': Evaluación de diseño
    '3': Evaluación de procesos o implementación
    '4': Evaluación de resultados
    '5': Evaluación de impacto
    '6': Evaluación económica o costo-beneficio
    '7': Auditoría de desempeño
    '8': Otro tipo
    '-88': No aplica porque no existe evaluación
    '-99': Sin información
- name: evaluacion_disponible
  block: G
  kind: categorical
  question: ¿Los resultados de la evaluación están publicados?
  codes:
    '1': Sí
    '2': 'No'
    '-88': No aplica porque no existe evaluación
    '-99': Sin información
- name: evaluacion_link
  block: G
  kind: url
  question: ¿Dónde pueden consultarse los resultados?
