  source: '15.12'
- if: subsidio_cofinanciamiento
  equals: '2'
  then_not_applicable:
  - subsidio_cofinanciamiento_prop
  source: '12'
- if: evaluacion_disponible
  equals: '2'
  then_not_applicable:
  - evaluacion_link
  source: '12'
